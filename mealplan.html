
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyCook - Weekly Meal Planner</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="mealplan">
  <div class="app">

    <aside class="sidebar">
      <div class="brand">🍲 Easy<span>Cook</span></div>

      <nav class="nav">
        <a href="index.html" data-page="home">🏠 <span>Home</span></a>
        <a href="recipes.html" data-page="recipes">🔎 <span>Recipe Explorer</span></a>
        <a href="suggestion.html" data-page="suggestion">✨ <span>Recipe Suggestion</span></a>
        <a href="collection.html" data-page="collection">♡ <span>My Recipe Collection</span></a>
        <a href="mealplan.html" data-page="mealplan">📅 <span>Weekly Meal Planner</span></a>
      </nav>

      <div class="sidebar-bottom">🧁 💜</div>
    </aside>

    <main class="main">

      <div class="page-header">
        <div>
          <p class="eyebrow">ORGANISE YOUR WEEK</p>
          <h1>Weekly Meal Planner 📅</h1>
          <p class="subtitle">
            Plan your breakfast, lunch and dinner.
          </p>
        </div>

        <div class="header-art">🥘</div>
      </div>

      <button id="togglePlanForm" class="btn primary">
        + Add Meal Plan
      </button>

      <p id="plannerMessage" class="message"></p>

      <div id="planForm" class="panel hidden">
        <h2 id="planFormTitle">Add Meal Plan</h2>

        <div class="form-grid">

          <label class="form-field">
            Recipe
            <select id="planRecipe">
              <option value="">Loading recipes...</option>
            </select>
          </label>

          <label class="form-field">
            Day
            <select id="planDay"></select>
          </label>

          <label class="form-field">
            Meal Time
            <select id="planTime"></select>
          </label>

        </div>

        <div class="actions">
          <button id="savePlanBtn" class="btn primary">
            Save Meal Plan
          </button>

          <button id="cancelPlanBtn" class="btn light">
            Cancel
          </button>
        </div>
      </div>

      <div id="weeklySchedule" class="weekly-grid"></div>

    </main>
  </div>

  <script src="common.js"></script>
  <script src="mealplan.js"></script>
</body>
</html>
